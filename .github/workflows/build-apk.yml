name: build-apk

# 手工触发 + 推 main 触发：APK 产物走 Actions，构建链路与本地 build.sh 完全一致
on:
  push:
    branches: [main]
  workflow_dispatch:

# 建 release / 覆盖 release 资产要写仓库内容
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK（platform 33 + build-tools 34.0.0）
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # 签名不一致就装不上（INSTALL_FAILED_UPDATE_INCOMPATIBLE），所以统一签名密钥走 secret 还原：
      #   SEAGULL_KEYSTORE_B64 = keystore/seagull-release.keystore 的 base64（唯一签名文件）
      #   SEAGULL_KS_PASS      = 该密钥库/密钥的密码
      # 配好后每个包签名完全一致，覆盖安装无需卸载。没配则现场生成临时密钥，只适合试装。
      - name: 还原统一签名密钥
        env:
          KS_B64: ${{ secrets.SEAGULL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SEAGULL_KS_PASS }}
        run: |
          set -e
          mkdir -p app/keystore
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > app/keystore/seagull-release.keystore
            printf 'alias=seagull-release\nksPass=%s\nkeyPass=%s\n' "$KS_PASS" "$KS_PASS" \
              > app/keystore/seagull-release.properties
            echo "用固定签名密钥（SEAGULL_KEYSTORE_B64 已还原）"
          else
            echo "::warning::未配 SEAGULL_KEYSTORE_B64/SEAGULL_KS_PASS，本次为临时密钥，装到已有版本上会签名不一致"
          fi
          echo "SEAGULL_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: 编译 APK
        env:
          SEAGULL_SDK: /home/runner/android-sdk
          SEAGULL_ANDROID_JAR: /home/runner/android-sdk/platforms/android-33/android.jar
        run: |
          export SEAGULL_JAVA_HOME="$JAVA_HOME"
          bash app/build.sh

      - name: 留档产物
        uses: actions/upload-artifact@v4
        with:
          name: SeagullLauncher-apk
          path: app/out/SeagullLauncher.apk
          if-no-files-found: error

      # tag = v<apk 里的 versionName>：应用内「检查更新」就是拿 tag 去掉 v 跟本机 versionName 比。
      # 同一个 tag 反复覆盖资产，固定下载地址 releases/latest/download/SeagullLauncher.apk 永远指向最新包。
      - name: 挂到 release（免登录固定下载入口）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/out/SeagullLauncher.apk \
            | sed -nE "s/^package: .*versionCode='[^']*' versionName='([^']+)'.*/\1/p" | head -1)
          [ -n "$VER" ] || { echo "读不到 versionName"; exit 1; }
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/out/SeagullLauncher.apk --clobber
            echo "已覆盖 $TAG 的安装包"
          else
            gh release create "$TAG" app/out/SeagullLauncher.apk \
              --title "海鸥桌面 $TAG" \
              --notes "批次 A~I 的自动构建。免登录下载：https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SeagullLauncher.apk"
          fi
          echo "下载地址 https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SeagullLauncher.apk"

  # 落雪音乐车机版（lx-music-car fork）+ CARLINK 直连补丁：
  # 源码 = caogenfunan123/lx-music-car 的 carlink 分支（补丁常驻该分支，随分支头走）。
  # 用海鸥桌面同一把签名密钥（SEAGULL_KEYSTORE_B64），覆盖安装无需卸载。
  lx-music-car:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 装 Node 18（lx .nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 拉落雪源码（carlink 分支）
        run: |
          set -e
          git clone --depth 1 --branch carlink \
            https://github.com/caogenfunan123/lx-music-car.git /tmp/lx

      - name: 安装依赖
        working-directory: /tmp/lx
        run: npm ci

      - name: 还原海鸥签名密钥
        env:
          KS_B64: ${{ secrets.SEAGULL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SEAGULL_KS_PASS }}
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > /tmp/lx/android/app/seagull-release.keystore
            echo "SEAGULL_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "用固定签名密钥（与海鸥桌面同签）"
          else
            echo "::warning::未配 SEAGULL_KEYSTORE_B64/SEAGULL_KS_PASS，落雪包退回 debug 签名"
            echo "SEAGULL_KS_PASS=" >> "$GITHUB_ENV"
          fi

      - name: 编译 APK（JS bundle + gradle）
        env:
          DISABLE_SVG: 1
        working-directory: /tmp/lx/android
        run: |
          set -e
          if [ -n "$SEAGULL_KS_PASS" ]; then
            ./gradlew assembleRelease \
              -PMYAPP_UPLOAD_STORE_FILE=seagull-release.keystore \
              -PMYAPP_UPLOAD_KEY_ALIAS=seagull-release \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$SEAGULL_KS_PASS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$SEAGULL_KS_PASS"
          else
            ./gradlew assembleRelease
          fi

      - name: 留档产物
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-car-apk
          path: /tmp/lx/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 跟海鸥桌面同款发布纪律：tag = v<versionName>，同 tag 反复覆盖资产，
      # universal 包改名 lx-music-car.apk → releases/latest/download/lx-music-car.apk 固定下载。
      # 跨仓发布用 CROSS_RELEASE_TOKEN（lx-music-car 仓库），没有则跳过（artifact 仍可取）。
      - name: 挂到 lx 仓库 release（免登录固定下载入口）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CROSS_RELEASE_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配 CROSS_RELEASE_TOKEN，跳过 release 发布（artifact 照常）"
            exit 0
          fi
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          OUT=/tmp/lx/android/app/build/outputs/apk/release
          APK=$(ls "$OUT"/*universal*.apk | head -1)
          VER=$("$AAPT2" dump badging "$APK" | sed -nE "s/^package: .*versionName='([^']+)'.*/\1/p" | head -1)
          [ -n "$VER" ] || { echo "读不到 versionName"; exit 1; }
          TAG="v$VER"
          R=caogenfunan123/lx-music-car
          cp "$APK" /tmp/lx-music-car.apk
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/lx-music-car.apk -R "$R" --clobber
            echo "已覆盖 $R 的 $TAG 安装包"
          else
            gh release create "$TAG" /tmp/lx-music-car.apk -R "$R" \
              --title "落雪车机版（CARLINK 直连）$TAG" \
              --notes "含海鸥桌面歌词直连补丁，与海鸥桌面同一签名密钥。免登录下载：https://github.com/$R/releases/latest/download/lx-music-car.apk"
          fi
          echo "下载地址 https://github.com/$R/releases/latest/download/lx-music-car.apk"
